<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="390" viewBox="0 0 1040 390" role="img" aria-label="Évaluation chronologique sur données synthétiques"><title>Évaluation chronologique sur données synthétiques</title><desc>Six observations d'entraînement et quatre observations de test. La persistance ne voit chaque observation que pour la prévision du jour suivant.</desc><rect width="1040" height="390" fill="#ffffff"/><style>text{font-family:Arial,Helvetica,sans-serif;fill:#1f2937}.h{font-size:19px;font-weight:700}.s{font-size:13px}.t{font-size:16px;font-weight:700}.box{stroke:#374151;stroke-width:1.5;fill:#f5f9ff}.warn{fill:#fff7ed;stroke:#9a3412;stroke-width:1.5}.ok{fill:#effaf3;stroke:#166534;stroke-width:1.5}.arrow{fill:none;stroke:#374151;stroke-width:2;marker-end:url(#arrow)}</style><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#374151"/></marker></defs><text x="30" y="38" class="h">Expérience V01-C11 : ne pas utiliser le futur</text><rect x="25" y="95" width="90" height="81" rx="10" class="box"/><text x="38" y="121" class="t">J01</text><text x="38" y="143" class="s">3 min</text><rect x="126" y="95" width="90" height="81" rx="10" class="box"/><text x="139" y="121" class="t">J02</text><text x="139" y="143" class="s">5 min</text><rect x="227" y="95" width="90" height="81" rx="10" class="box"/><text x="240" y="121" class="t">J03</text><text x="240" y="143" class="s">4 min</text><rect x="328" y="95" width="90" height="81" rx="10" class="box"/><text x="341" y="121" class="t">J04</text><text x="341" y="143" class="s">6 min</text><rect x="429" y="95" width="90" height="81" rx="10" class="box"/><text x="442" y="121" class="t">J05</text><text x="442" y="143" class="s">5 min</text><rect x="530" y="95" width="90" height="81" rx="10" class="box"/><text x="543" y="121" class="t">J06</text><text x="543" y="143" class="s">7 min</text><rect x="631" y="95" width="90" height="81" rx="10" class="ok"/><text x="644" y="121" class="t">J07</text><text x="644" y="143" class="s">6 min</text><rect x="732" y="95" width="90" height="81" rx="10" class="ok"/><text x="745" y="121" class="t">J08</text><text x="745" y="143" class="s">8 min</text><rect x="833" y="95" width="90" height="81" rx="10" class="ok"/><text x="846" y="121" class="t">J09</text><text x="846" y="143" class="s">7 min</text><rect x="934" y="95" width="90" height="81" rx="10" class="ok"/><text x="947" y="121" class="t">J10</text><text x="947" y="143" class="s">9 min</text><text x="170" y="225" class="t">ENTRAÎNEMENT (J01–J06)</text><text x="733" y="225" class="t">TEST (J07–J10)</text><path d="M560 245 L625 245" class="arrow"/><text x="20" y="284" class="s">Baseline A : moyenne de l'entraînement = 5 min ; prédictions test (5, 5, 5, 5) ; MAE = 2,5 min</text><text x="20" y="319" class="s">Baseline B : dernière mesure avant chaque jour ; prédictions (7, 6, 8, 7) ; MAE = 1,5 min</text><text x="20" y="352" class="s">Attention : J08 ne peut utiliser J07 que si J07 a été observé avant la prédiction de J08.</text></svg>
