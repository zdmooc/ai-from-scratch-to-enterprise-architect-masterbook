<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="590" viewBox="0 0 1120 590" role="img" aria-labelledby="figure-title figure-desc">
<title id="figure-title">Attention Q K V : produit scalaire, softmax et somme pondérée</title><desc id="figure-desc">Une requête de deux coordonnées est comparée à deux clés, normalisée par racine de deux, transformée par softmax en poids 0,66976 et 0,33024 puis pondère deux valeurs pour obtenir un vecteur de sortie; exemple non masqué.</desc><rect x="0" y="0" width="1120" height="590" fill="#ffffff"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#365578"/></marker><marker id="back" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#a65435"/></marker></defs><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#1a2940} .title{font-size:25px;font-weight:700} .subtitle{font-size:14px;fill:#43556e}.head{font-size:17px;font-weight:700} .body{font-size:14px}.mini{font-size:12px}.card{fill:#f0f5fb;stroke:#8da9c7;stroke-width:1.5}.safe{fill:#ebf6ef;stroke:#4c9070;stroke-width:1.8}.caution{fill:#fff6e9;stroke:#be854e;stroke-width:1.8}.link{stroke:#365578;stroke-width:2;fill:none;marker-end:url(#arrow)}.back{stroke:#a65435;stroke-width:2;stroke-dasharray:6 4;fill:none;marker-end:url(#back)}.separator{stroke:#9caec0;stroke-dasharray:8 6;stroke-width:2}</style><text x="35" y="45" class="title">Attention Q/K/V — exemple numérique entièrement calculable</text><text x="35" y="74" class="subtitle">Une requête, deux clés, deux valeurs — pas de masque dans cet exemple</text><rect x="30" y="134" width="220" height="145" rx="13" class="card"/><text x="45" y="162" class="head">Entrées</text><text x="45" y="189" class="body">Query Q = (1, 0)</text><text x="45" y="211" class="body">Key K1 = (1, 0)</text><text x="45" y="233" class="body">Key K2 = (0, 1)</text><rect x="314" y="134" width="225" height="145" rx="13" class="card"/><text x="329" y="162" class="head">Scores mis à l'échelle</text><text x="329" y="189" class="body">Q·K1 / √2 ≈ 0,7071</text><text x="329" y="211" class="body">Q·K2 / √2 = 0</text><text x="329" y="233" class="body">dk = 2</text><rect x="603" y="134" width="235" height="145" rx="13" class="safe"/><text x="618" y="162" class="head">Softmax des scores</text><text x="618" y="189" class="body">Poids pour K1 ≈ 0,66976</text><text x="618" y="211" class="body">Poids pour K2 ≈ 0,33024</text><text x="618" y="233" class="body">Somme des poids = 1</text><rect x="903" y="134" width="185" height="145" rx="13" class="card"/><text x="918" y="162" class="head">Valeurs</text><text x="918" y="189" class="body">V1 = (2, 0)</text><text x="918" y="211" class="body">V2 = (0, 2)</text><text x="918" y="233" class="body">dv = 2</text><path d="M250,208 L314,208" class="link"/><path d="M539,208 L603,208" class="link"/><path d="M838,208 L903,208" class="link"/><rect x="264" y="345" width="597" height="119" rx="13" class="safe"/><text x="279" y="373" class="head">Combinaison pondérée</text><text x="279" y="400" class="body">Sortie = 0,66976 × (2, 0) + 0,33024 × (0, 2)</text><text x="279" y="422" class="body">≈ (1,33952 ; 0,66048)</text><path d="M728,279 L728,345" class="link"/><text x="35" y="497" class="body">Avec masque causal, certaines clés sont exclues AVANT softmax ; un masque vide doit être refusé.</text><text x="35" y="522" class="body">Les poids d'attention ne constituent ni une preuve de vérité, ni un contrôle IAM.</text><text x="35" y="556" class="mini">Programme et tests : labs/v01-attention-qkv — calcul CPU, aucune inférence LLM réelle.</text></svg>
