<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1030" height="460" viewBox="0 0 1030 460" role="img" aria-label="Agent en lecture seule : frontières de confiance"><title>Agent en lecture seule : frontières de confiance</title><desc>Flux de requête authentifiée vers dispatcher à outils autorisés et ressources de lecture seule, les outils de mutation sont interdits.</desc><rect width="1030" height="460" fill="#ffffff"/><style>text{font-family:Arial,Helvetica,sans-serif;fill:#1f2937}.h{font-size:19px;font-weight:700}.s{font-size:13px}.t{font-size:16px;font-weight:700}.box{stroke:#374151;stroke-width:1.5;fill:#f5f9ff}.warn{fill:#fff7ed;stroke:#9a3412;stroke-width:1.5}.ok{fill:#effaf3;stroke:#166534;stroke-width:1.5}.arrow{fill:none;stroke:#374151;stroke-width:2;marker-end:url(#arrow)}</style><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#374151"/></marker></defs><text x="30" y="35" class="h">Agent outillé : permissions imposées hors prompt</text><rect x="20" y="100" width="188" height="88" rx="10" class="box"/><text x="33" y="126" class="t">Utilisateur</text><text x="33" y="148" class="s">Identité établie</text><rect x="280" y="100" width="205" height="88" rx="10" class="box"/><text x="293" y="126" class="t">API / contrôle</text><text x="293" y="148" class="s">Authentification + ACL</text><rect x="557" y="100" width="220" height="88" rx="10" class="ok"/><text x="570" y="126" class="t">Dispatcher</text><text x="570" y="148" class="s">Liste blanche outils</text><rect x="845" y="100" width="162" height="88" rx="10" class="ok"/><text x="858" y="126" class="t">Services</text><text x="858" y="148" class="s">Lecture seule</text><path d="M208 144 L280 144" class="arrow"/><path d="M485 144 L557 144" class="arrow"/><path d="M777 144 L845 144" class="arrow"/><rect x="340" y="275" width="295" height="100" rx="10" class="warn"/><text x="353" y="301" class="t">Document externe</text><text x="353" y="323" class="s">Donnée de moindre confiance</text><text x="353" y="345" class="s">Jamais politique ou commande</text><path d="M920 188 L640 275" class="arrow"/><rect x="685" y="300" width="320" height="76" rx="10" class="warn"/><text x="698" y="326" class="t">Outils de mutation</text><text x="698" y="348" class="s">Non déclarés : refus technique</text><path d="M675 175 L825 300" class="arrow"/><text x="28" y="426" class="s">La phrase « ne fais rien » dans un prompt ne remplace jamais une ACL ni un refus côté API.</text></svg>
