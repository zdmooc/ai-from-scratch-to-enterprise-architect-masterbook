<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="590" viewBox="0 0 1120 590" role="img" aria-labelledby="figure-title figure-desc">
<title id="figure-title">Un petit réseau neuronal : calcul avant et gradient en retour</title><desc id="figure-desc">Deux variables alimentent une combinaison pondérée, suivie d'une activation, d'une prédiction et d'une perte. Le calcul du gradient remonte de la perte vers les paramètres; il ne donne aucune preuve de généralisation.</desc><rect x="0" y="0" width="1120" height="590" fill="#ffffff"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#365578"/></marker><marker id="back" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#a65435"/></marker></defs><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#1a2940} .title{font-size:25px;font-weight:700} .subtitle{font-size:14px;fill:#43556e}.head{font-size:17px;font-weight:700} .body{font-size:14px}.mini{font-size:12px}.card{fill:#f0f5fb;stroke:#8da9c7;stroke-width:1.5}.safe{fill:#ebf6ef;stroke:#4c9070;stroke-width:1.8}.caution{fill:#fff6e9;stroke:#be854e;stroke-width:1.8}.link{stroke:#365578;stroke-width:2;fill:none;marker-end:url(#arrow)}.back{stroke:#a65435;stroke-width:2;stroke-dasharray:6 4;fill:none;marker-end:url(#back)}.separator{stroke:#9caec0;stroke-dasharray:8 6;stroke-width:2}</style><text x="40" y="46" class="title">Réseau neuronal : calcul avant et retour des gradients</text><text x="40" y="76" class="subtitle">Modèle pédagogique — un neurone, paramètres w1, w2 et b</text><rect x="35" y="155" width="205" height="145" rx="13" class="card"/><text x="50" y="183" class="head">Entrée x</text><text x="50" y="210" class="body">x1 : première variable</text><text x="50" y="232" class="body">x2 : seconde variable</text><text x="50" y="254" class="body">Données synthétiques</text><rect x="305" y="155" width="232" height="145" rx="13" class="card"/><text x="320" y="183" class="head">Somme pondérée</text><text x="320" y="210" class="body">z = w1 × x1 + w2 × x2</text><text x="320" y="232" class="body">    + b</text><text x="320" y="254" class="body">Poids et biais appris</text><rect x="606" y="155" width="200" height="145" rx="13" class="card"/><text x="621" y="183" class="head">Activation</text><text x="621" y="210" class="body">a = f(z)</text><text x="621" y="232" class="body">Ex. : ReLU</text><text x="621" y="254" class="body">max(0, z)</text><rect x="868" y="155" width="215" height="145" rx="13" class="card"/><text x="883" y="183" class="head">Perte</text><text x="883" y="210" class="body">L(a, cible)</text><text x="883" y="232" class="body">Écart à minimiser</text><text x="883" y="254" class="body">Ex. : MSE</text><path d="M240,226 L305,226" class="link"/><path d="M537,226 L606,226" class="link"/><path d="M806,226 L868,226" class="link"/><text x="460" y="357" class="head" text-anchor="middle">PROPAGATION AVANT : calcul de la prédiction</text><path d="M970,405 L730,405" class="back"/><path d="M650,405 L420,405" class="back"/><path d="M340,405 L130,405" class="back"/><text x="45" y="385" class="head">RÉTROPROPAGATION (chaîne de dérivées)</text><text x="45" y="456" class="body">Gradient : variation locale de la perte par rapport aux paramètres.</text><text x="45" y="481" class="body">Mise à jour simple : w ← w − taux × gradient ; l'entraînement nécessite un protocole de validation.</text><rect x="40" y="510" width="1038" height="57" rx="13" class="caution"/><text x="55" y="538" class="head">Ce qui n'est pas démontré</text><text x="55" y="565" class="body">Ni performance industrielle, ni généralisation à de nouvelles données, ni entraînement GPU.</text></svg>
