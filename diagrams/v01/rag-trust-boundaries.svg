<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="590" viewBox="0 0 1120 590" role="img" aria-labelledby="figure-title figure-desc">
<title id="figure-title">Pipeline RAG : identité, filtrage des droits et vérification des sources</title><desc id="figure-desc">Le flux utilisateur passe par l'authentification et la politique d'accès; la récupération documentaire est filtrée avant toute transmission à un modèle. Le modèle propose une synthèse, validée contre les références avant réponse; aucun outil de mutation n'est accordé.</desc><rect x="0" y="0" width="1120" height="590" fill="#ffffff"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#365578"/></marker><marker id="back" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#a65435"/></marker></defs><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#1a2940} .title{font-size:25px;font-weight:700} .subtitle{font-size:14px;fill:#43556e}.head{font-size:17px;font-weight:700} .body{font-size:14px}.mini{font-size:12px}.card{fill:#f0f5fb;stroke:#8da9c7;stroke-width:1.5}.safe{fill:#ebf6ef;stroke:#4c9070;stroke-width:1.8}.caution{fill:#fff6e9;stroke:#be854e;stroke-width:1.8}.link{stroke:#365578;stroke-width:2;fill:none;marker-end:url(#arrow)}.back{stroke:#a65435;stroke-width:2;stroke-dasharray:6 4;fill:none;marker-end:url(#back)}.separator{stroke:#9caec0;stroke-dasharray:8 6;stroke-width:2}</style><text x="35" y="45" class="title">RAG documentaire : sources autorisées avant génération</text><text x="35" y="75" class="subtitle">Architecture de principe — à tester ; aucune preuve de déploiement réel</text><rect x="30" y="133" width="195" height="122" rx="13" class="card"/><text x="45" y="161" class="head">Utilisateur</text><text x="45" y="188" class="body">Identité / périmètre</text><text x="45" y="210" class="body">Demande d'information</text><rect x="280" y="133" width="225" height="122" rx="13" class="safe"/><text x="295" y="161" class="head">API et politique</text><text x="295" y="188" class="body">Authentification</text><text x="295" y="210" class="body">Permissions effectives</text><rect x="560" y="133" width="246" height="122" rx="13" class="safe"/><text x="575" y="161" class="head">Récupération filtrée</text><text x="575" y="188" class="body">ACL AVANT les documents</text><text x="575" y="210" class="body">Versions et date d'effet</text><rect x="862" y="133" width="222" height="122" rx="13" class="card"/><text x="877" y="161" class="head">Modèle</text><text x="877" y="188" class="body">Synthèse proposée</text><text x="877" y="210" class="body">Pas de source de vérité</text><path d="M225,197 L280,197" class="link"/><path d="M505,197 L560,197" class="link"/><path d="M806,197 L862,197" class="link"/><rect x="280" y="327" width="225" height="118" rx="13" class="card"/><text x="295" y="355" class="head">Référentiel</text><text x="295" y="382" class="body">Documents versionnés</text><text x="295" y="404" class="body">Propriétaire des sources</text><rect x="610" y="327" width="255" height="118" rx="13" class="safe"/><text x="625" y="355" class="head">Validation</text><text x="625" y="382" class="body">Citations existantes</text><text x="625" y="404" class="body">Abstention si doute</text><path d="M405,327 L647,255" class="link"/><path d="M974,255 L737,327" class="link"/><rect x="882" y="327" width="202" height="118" rx="13" class="safe"/><text x="897" y="355" class="head">Réponse</text><text x="897" y="382" class="body">Sources vérifiées</text><text x="897" y="404" class="body">Limites explicites</text><path d="M865,382 L882,382" class="link"/><text x="35" y="491" class="body">Frontière critique : un document récupéré reste une donnée de moindre confiance.</text><text x="35" y="517" class="body">Aucun contenu de source n'autorise une action ni ne modifie les permissions du service.</text><text x="35" y="552" class="mini">Si source absente, non autorisée ou contradictoire : refus, abstention ou escalade selon la politique.</text></svg>
