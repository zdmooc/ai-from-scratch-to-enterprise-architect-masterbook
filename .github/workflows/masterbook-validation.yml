name: masterbook-validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate editorial structure
        run: python scripts/validate_masterbook.py
      - name: Check V01 preview configuration without writing
        run: python scripts/build_volume.py --volume 01 --format html --dry-run
      - name: Run V01 symbolic lab tests
        run: python -m unittest discover -s labs/v01-symbolic-ai -p 'test_*.py' -v
      - name: Run V02 vector lab tests
        run: python -m unittest discover -s labs/v02-vectors -p 'test_*.py' -v
      - name: Run V03 introductory statistics lab tests
        run: python -m unittest discover -s labs/v03-python-basics -p 'test_*.py' -v
      - name: Check V02 and V03 Quarto preview configuration without writing
        run: |
          python scripts/build_volume.py --volume 02 --format html --dry-run
          python scripts/build_volume.py --volume 03 --format html --dry-run
      - name: Run V01 experiment lab tests
        run: python -m unittest discover -s labs/v01-experiment -p 'test_*.py' -v
